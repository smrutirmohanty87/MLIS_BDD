              secureFile: 'automation_server.key'

          - script: |
              echo "##vso[task.setvariable variable=SALEFORCE_UAT2_JWT_PRIVATE_KEY_PATH]$(salesforceJwtKey.secureFilePath)"
              echo "##vso[task.setvariable variable=SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH]$(salesforceJwtKey.secureFilePath)"
            displayName: 'Set Salesforce UAT2 JWT key path'

          - script: |
              echo "JWT key path:"
              echo "$SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH"
              echo "JWT key exists:"
              test -f "$SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH" && echo "YES" || echo "NO"
            displayName: 'Verify Salesforce JWT key'

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: npm ci
            displayName: 'Install Node dependencies'

          - script: npx playwright install --with-deps $(BROWSER)
            displayName: 'Install Playwright browsers'

          - script: npx playwright test tests/BDX/TC_BDX_006_BDE_new_cancel_and_reissue_then_cancel_policy.spec.ts --project=$(BROWSER) --workers=1 --reporter=list,html
            displayName: 'Run TC_BDX_006 — BDE Cancel & Reissue then Cancel'
            env:
              CI: $(CI)
              TEST_ENV: $(TEST_ENV)
              TEST_BROKER_PROFILE: $(TEST_BROKER_PROFILE)
              MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
              SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
              SALEFORCE_UAT2_NO_COMM_BROKERUSER: $(SALEFORCE_UAT2_NO_COMM_BROKERUSER)
              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT2_ENHANCEDUSER: $(SALEFORCE_UAT2_ENHANCEDUSER)
              SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD)
              SALESFORCE_UAT2_JWT_CLIENT_ID: $(SALESFORCE_UAT2_JWT_CLIENT_ID)
              SALESFORCE_UAT2_JWT_LOGIN_URL: $(SALESFORCE_UAT2_JWT_LOGIN_URL)
              SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH: $(SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH)
              SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
              SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT2_NO_COMM_BROKERUSER: $(SALEFORCE_SIT2_NO_COMM_BROKERUSER)
              SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT2_ENHANCEDUSER: $(SALEFORCE_SIT2_ENHANCEDUSER)
              SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-006-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 Results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-006-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: 'pipeline'

  # ---------------------------------------------------------------------------
  # STAGE 4 — Publish Consolidated Results
  # ---------------------------------------------------------------------------
  - stage: Publish_Results
    displayName: 'Publish Consolidated Results'
    dependsOn:
      - Sanity_Tests
      - Regression_Tests
      - BDX_Core_Tests
      - BDX_Advanced_Tests
    condition: always()
    jobs:
      - job: ConsolidateResults
        displayName: 'Consolidate and Summarise Results'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download all artifacts'
            inputs:
              buildType: 'current'
              targetPath: '$(Pipeline.Workspace)/artifacts'

          - script: |
              echo "========================================"
              echo "  MLIS Test Automation — Run Summary"
              echo "========================================"
              echo "  Environment : $(TEST_ENV)"
              echo "  Browser     : $(BROWSER)"
              echo "========================================"
            displayName: 'Display run summary'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Dashboard Report'
            condition: always()
            inputs:
              targetPath: 'reports/dashboard'
              artifact: 'test-dashboard-$(TEST_ENV)'
              publishLocation: 'pipeline'




