# =============================================================================
# MLIS Test Automation Framework — Azure DevOps Pipeline
#
# Prerequisites (set as pipeline secret variables in Azure DevOps UI):
#
#   UAT2 (active / unprefixed keys):
#     MLIS_PORTAL_URL, SALESFORCE_LIGHTNING_URL,
#     SALEFORCE_UAT2_NO_COMM_BROKERUSER, SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD,
#     SALEFORCE_UAT2_ENHANCEDUSER, SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD
#
#   SIT2 (SIT2_* prefixed keys):
#     SIT2_MLIS_PORTAL_URL, SIT2_SALESFORCE_LIGHTNING_URL,
#     SALEFORCE_SIT2_NO_COMM_BROKERUSER, SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD,
#     SALEFORCE_SIT2_ENHANCEDUSER, SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD
#
# Select environment at queue time via the testEnv parameter below.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - tests/**
      - src/**
      - playwright.config.ts
      - package.json

pr:
  branches:
    include:
      - main
      - master
      - develop

parameters:
  - name: testEnv
    displayName: 'Target Environment'
    type: string
    default: 'UAT2'
    values:
      - UAT2
      - SIT2

  - name: testSuite
    displayName: 'Test Suite'
    type: string
    default: 'all'
    values:
      - all
      - sanity
      - regression
      - bdx

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - chrome
      - chromium
      - msedge

variables:
  - name: nodeVersion
    value: '18.x'
  - name: CI
    value: 'true'
  - name: TEST_ENV
    value: ${{ parameters.testEnv }}
  - name: BROWSER
    value: ${{ parameters.browser }}

stages:
  # ---------------------------------------------------------------------------
  # STAGE 1 — Sanity Tests (12 tests)
  # ---------------------------------------------------------------------------
  - stage: Sanity_Tests
    displayName: 'Sanity Tests (12 tests)'
    condition: |
      or(
        eq('${{ parameters.testSuite }}', 'sanity'),
        eq('${{ parameters.testSuite }}', 'all')
      )
    jobs:
      - job: RunSanityTests
        displayName: 'Run Sanity Tests — $(TEST_ENV)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: DownloadSecureFile@1
            name: salesforceJwtKey
            displayName: 'Download secure file: automation_server.key'
            inputs:
              secureFile: 'automation_server.key'

          - script: |
              echo "##vso[task.setvariable variable=SALEFORCE_UAT2_JWT_PRIVATE_KEY_PATH]$(salesforceJwtKey.secureFilePath)"
              echo "##vso[task.setvariable variable=SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH]$(salesforceJwtKey.secureFilePath)"
            displayName: 'Set Salesforce UAT2 JWT key path'

          - script: |
              echo "JWT key path:"
              echo "$SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH"
              echo "JWT key exists:"
              test -f "$SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH" && echo "YES" || echo "NO"
            displayName: 'Verify Salesforce JWT key'

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: npm ci
            displayName: 'Install Node dependencies'

          - script: npx playwright install --with-deps $(BROWSER)
            displayName: 'Install Playwright browsers'

          - script: npx playwright test tests/sanity/ --project=$(BROWSER) --workers=1 --reporter=list,html
            displayName: 'Run Sanity tests'
            env:
              CI: $(CI)
              TEST_ENV: $(TEST_ENV)
              TEST_BROKER_PROFILE: $(TEST_BROKER_PROFILE)
              MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
              SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
              SALEFORCE_UAT2_NO_COMM_BROKERUSER: $(SALEFORCE_UAT2_NO_COMM_BROKERUSER)
              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT2_ENHANCEDUSER: $(SALEFORCE_UAT2_ENHANCEDUSER)
              SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD)
              SALESFORCE_UAT2_JWT_CLIENT_ID: $(SALESFORCE_UAT2_JWT_CLIENT_ID)
              SALESFORCE_UAT2_JWT_LOGIN_URL: $(SALESFORCE_UAT2_JWT_LOGIN_URL)
              SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH: $(SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH)
              SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
              SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT2_NO_COMM_BROKERUSER: $(SALEFORCE_SIT2_NO_COMM_BROKERUSER)
              SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT2_ENHANCEDUSER: $(SALEFORCE_SIT2_ENHANCEDUSER)
              SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity HTML Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'sanity-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity Test Results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'sanity-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: 'pipeline'

  # ---------------------------------------------------------------------------
  # STAGE 2 — Regression Tests (19 tests)
  # ---------------------------------------------------------------------------
