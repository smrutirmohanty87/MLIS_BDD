# =============================================================================
# MLIS Test Automation â€” Consolidated Tag-Based Pipeline
# Covers: Sanity (12) | Regression (19) | BDX (6) test scenarios
#
# Tests are selected using Playwright's --grep flag with tags defined
# directly inside each test file's test.describe() block:
#
#   @sanity     â†’ tests/sanity/TC_SAN_001 â€“ TC_SAN_012
#   @regression â†’ tests/regression/TC_REG_001 â€“ TC_REG_019
#   @bdx        â†’ tests/BDX/TC_BDX_001 â€“ TC_BDX_006
#                 (BDX tests use @sanity tag + "BDX" in describe name;
#                  matched via --grep "@sanity" scoped to tests/BDX/)
#
# Equivalent local commands:
#   npx playwright test --grep "@sanity"     tests/sanity/
#   npx playwright test --grep "@regression" tests/regression/
#   npx playwright test --grep "@sanity"     tests/BDX/
#
# Pipeline secret variables required (set in Azure DevOps UI):
#
#   UAT1 environment (UAT1_* prefix):
#     UAT1_MLIS_PORTAL_URL         UAT1_SALESFORCE_LIGHTNING_URL
#     SALEFORCE_UAT1_NO_COMM_BROKERUSER         SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD
#     SALEFORCE_UAT1_ENHANCEDUSER     SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD
#
#   UAT2 environment:
#     MLIS_PORTAL_URL              SALESFORCE_LIGHTNING_URL
#     SALEFORCE_UAT2_NO_COMM_BROKERUSER              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD
#     SALEFORCE_UAT2_ENHANCEDUSER          SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD
#     SALEFORCE_UAT2_CLAIMUSER             SALEFORCE_UAT2_CLAIMUSER_PASSWORD
#     SALESFORCE_UAT2_JWT_CLIENT_ID        SALESFORCE_UAT2_JWT_USERNAME
#     SALESFORCE_UAT2_JWT_LOGIN_URL
#
#   SIT2 environment (SIT2_* prefix):
#     SIT2_MLIS_PORTAL_URL         SIT2_SALESFORCE_LIGHTNING_URL
#     SALEFORCE_SIT2_NO_COMM_BROKERUSER         SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD
#     SALEFORCE_SIT2_ENHANCEDUSER     SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD
#
#   DURQA environment (DURQA_* prefix):
#     DURQA_MLIS_PORTAL_URL        DURQA_SALESFORCE_LIGHTNING_URL
#     SALEFORCE_DURQA_NO_COMM_BROKERUSER        SALEFORCE_DURQA_NO_COMM_BROKERPASSWORD
#     SALEFORCE_DURQA_ENHANCEDUSER    SALEFORCE_DURQA_ENHANCEDUSER_PASSWORD
# =============================================================================

# ---------------------------------------------------------------------------
# CI Triggers
# ---------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - tests/**
      - src/**
      - playwright.config.ts
      - package.json

pr:
  branches:
    include:
      - main
      - master
      - develop

# ---------------------------------------------------------------------------
# Runtime Parameters
# ---------------------------------------------------------------------------
parameters:
  - name: testEnv
    displayName: 'Target Environment'
    type: string
    default: 'UAT2'
    values:
      - UAT1
      - UAT2
      - SIT1
      - SIT2
      - DURQA

  # Select tests by the @tag used in test.describe() blocks.
  # @sanity     â†’ runs TC_SAN_001â€“012  (tests/sanity/)
  # @regression â†’ runs TC_REG_001â€“019  (tests/regression/)
  # @claims     â†’ runs claims suite      (tests/claims/)
  # @bdx        â†’ runs TC_BDX_001â€“006  (tests/BDX/)
  # all         â†’ runs every suite in sequence
  - name: tag
    displayName: 'Test Tag (suite selector)'
    type: string
    default: 'all'
    values:
      - all
      - '@sanity'
      - '@regression'
      - '@claims'
      - '@bdx'

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - chrome
      - chromium
      - msedge

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
variables:
  nodeVersion: '18.x'
  CI: 'true'
  TEST_ENV: ${{ parameters.testEnv }}
  BROWSER: ${{ parameters.browser }}
  SELECTED_TAG: ${{ parameters.tag }}

# ===========================================================================
# STAGES
# ===========================================================================
stages:

  # =========================================================================
  # STAGE 1 â€” SANITY TESTS  (12 test cases)
  # Tag filter: --grep "@sanity"  scoped to tests/sanity/
  # Triggered when tag == '@sanity' or tag == 'all'
  # =========================================================================
  - stage: Sanity_Tests
    displayName: 'Stage 1 â€” Sanity Tests [@sanity] (12 tests)'
    condition: |
      or(
        eq('${{ parameters.tag }}', '@sanity'),
        eq('${{ parameters.tag }}', 'all')
      )
    jobs:
      - job: RunSanity
        displayName: 'Sanity [@sanity] â€” $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps $(BROWSER)
            displayName: 'Install Playwright browser â€” $(BROWSER)'

          # ----------------------------------------------------------------
          # Tag:  @sanity
          # Grep: --grep "@sanity"  (matches test.describe blocks prefixed @sanity)
          # Scope: tests/sanity/  (excludes BDX which also uses @sanity)
          #
          # Test cases matched:
          #   TC_SAN_001  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_002  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_003  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_004  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_005  @sanity | E2E | Salesforce Quote Journey | Commercial E&W
          #   TC_SAN_006  @sanity | E2E | Salesforce Quote Journey | Residential E&W
          #   TC_SAN_007  @sanity | E2E | Salesforce Quote Journey | Residential E&W Multiple Products
          #   TC_SAN_008  @sanity | E2E | Cancellation | From Inception
          #   TC_SAN_009  @sanity | E2E | Residential Quick Quote | England & Wales
          #   TC_SAN_010  @sanity | E2E | Residential Quick Quote | England & Wales
          #   TC_SAN_011  @sanity | E2E | Residential Quick Quote | Scotland
          #   TC_SAN_012  @sanity | E2E | Residential Quick Quote | Scotland
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/sanity/
              --grep "@sanity"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Sanity tests â€”tag @sanity (TC_SAN_001â€“012)'
            env:
              CI: $(CI)
              TEST_ENV: $(TEST_ENV)
              TEST_BROKER_PROFILE: $(TEST_BROKER_PROFILE)
              MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
              SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
              UAT1_MLIS_PORTAL_URL: $(UAT1_MLIS_PORTAL_URL)
              UAT1_SALESFORCE_LIGHTNING_URL: $(UAT1_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_UAT1_NO_COMM_BROKERUSER: $(SALEFORCE_UAT1_NO_COMM_BROKERUSER)
              SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT1_ENHANCEDUSER: $(SALEFORCE_UAT1_ENHANCEDUSER)
              SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_NO_COMM_BROKERUSER: $(SALEFORCE_UAT2_NO_COMM_BROKERUSER)
              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT2_ENHANCEDUSER: $(SALEFORCE_UAT2_ENHANCEDUSER)
              SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_CLAIMUSER: $(SALEFORCE_UAT2_CLAIMUSER)
              SALEFORCE_UAT2_CLAIMUSER_PASSWORD: $(SALEFORCE_UAT2_CLAIMUSER_PASSWORD)
              SALESFORCE_UAT2_JWT_CLIENT_ID: $(SALESFORCE_UAT2_JWT_CLIENT_ID)
              SALESFORCE_UAT2_JWT_USERNAME: $(SALESFORCE_UAT2_JWT_USERNAME)
              SALESFORCE_UAT2_JWT_LOGIN_URL: $(SALESFORCE_UAT2_JWT_LOGIN_URL)
              SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH: $(SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH)
              SIT1_MLIS_PORTAL_URL: $(SIT1_MLIS_PORTAL_URL)
              SIT1_SALESFORCE_LIGHTNING_URL: $(SIT1_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT1_NO_COMM_BROKERUSER: $(SALEFORCE_SIT1_NO_COMM_BROKERUSER)
              SALEFORCE_SIT1_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT1_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT1_CLAIMUSER: $(SALEFORCE_SIT1_CLAIMUSER)
              SALEFORCE_SIT1_CLAIMUSER_PASSWORD: $(SALEFORCE_SIT1_CLAIMUSER_PASSWORD)
              SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
              SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT2_NO_COMM_BROKERUSER: $(SALEFORCE_SIT2_NO_COMM_BROKERUSER)
              SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT2_ENHANCEDUSER: $(SALEFORCE_SIT2_ENHANCEDUSER)
              SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD)
              DURQA_MLIS_PORTAL_URL: $(DURQA_MLIS_PORTAL_URL)
              DURQA_SALESFORCE_LIGHTNING_URL: $(DURQA_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_DURQA_NO_COMM_BROKERUSER: $(SALEFORCE_DURQA_NO_COMM_BROKERUSER)
              SALEFORCE_DURQA_NO_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_NO_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_INTER_COMM_BROKERUSER: $(SALEFORCE_DURQA_INTER_COMM_BROKERUSER)
              SALEFORCE_DURQA_INTER_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_INTER_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_BDE_COMM_BROKERUSER: $(SALEFORCE_DURQA_BDE_COMM_BROKERUSER)
              SALEFORCE_DURQA_BDE_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_BDE_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_INTRO_COMM_BROKERUSER: $(SALEFORCE_DURQA_INTRO_COMM_BROKERUSER)
              SALEFORCE_DURQA_INTRO_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_INTRO_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_ENHANCEDUSER: $(SALEFORCE_DURQA_ENHANCEDUSER)
              SALEFORCE_DURQA_ENHANCEDUSER_PASSWORD: $(SALEFORCE_DURQA_ENHANCEDUSER_PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'sanity-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'sanity-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 2 â€” REGRESSION TESTS  (19 test cases)
  # Tag filter: --grep "@regression"  scoped to tests/regression/
  # Triggered when tag == '@regression' or tag == 'all'
  # =========================================================================
  - stage: Regression_Tests
    displayName: 'Stage 2 â€” Regression Tests [@regression] (19 tests)'
    dependsOn: Sanity_Tests
    condition: |
      and(
        or(
          eq('${{ parameters.tag }}', '@regression'),
          eq('${{ parameters.tag }}', 'all')
        ),
        in(dependencies.Sanity_Tests.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped')
      )
    jobs:
      - job: RunRegression
        displayName: 'Regression [@regression] â€” $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 150
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps $(BROWSER)
            displayName: 'Install Playwright browser â€” $(BROWSER)'

          # ----------------------------------------------------------------
          # Tag:  @regression
          # Grep: --grep "@regression"  (matches test.describe blocks prefixed @regression)
          # Scope: tests/regression/
          #
          # Test cases matched:
          #   TC_REG_001  @regression | E2E | Commercial | Northern Ireland
          #   TC_REG_002  @regression | E2E | Commercial | Northern Ireland
          #   TC_REG_003  @regression | E2E | Commercial | Scotland
          #   TC_REG_004  @regression | E2E | Commercial | Scotland
          #   TC_REG_005  @regression | E2E | Residential | England & Wales
          #   TC_REG_006  @regression | E2E | Residential | England & Wales
          #   TC_REG_007  @regression | E2E | Residential | Northern Ireland
          #   TC_REG_008  @regression | E2E | Residential | Northern Ireland
          #   TC_REG_009  @regression | E2E | Residential | Scotland
          #   TC_REG_010  @regression | E2E | Residential | Scotland
          #   TC_REG_011  @regression | E2E | Notes & Attachments | England & Wales
          #   TC_REG_012  @regression | E2E | Notes & Attachments | Commercial
          #   TC_REG_013  @regression | E2E | Notes & Attachments | Commercial Scotland
          #   TC_REG_014  @regression | E2E | MTA
          #   TC_REG_015  @regression | E2E | Cancel and Reissue
          #   TC_REG_016  @regression | E2E | MTA + Cancellation
          #   TC_REG_017  @regression | E2E | MTA + Cancel and Reissue
          #   TC_REG_018  @regression | E2E | MTA + Cancel and Reissue + Cancellation
          #   TC_REG_019  @regression | E2E | Cancel and Reissue + Cancellation
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/regression/
              --grep "@regression"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Regression tests â€” tag @regression (TC_REG_001â€“019)'
            env:
              CI: $(CI)
              TEST_ENV: $(TEST_ENV)
              TEST_BROKER_PROFILE: $(TEST_BROKER_PROFILE)
              MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
              SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
              UAT1_MLIS_PORTAL_URL: $(UAT1_MLIS_PORTAL_URL)
              UAT1_SALESFORCE_LIGHTNING_URL: $(UAT1_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_UAT1_NO_COMM_BROKERUSER: $(SALEFORCE_UAT1_NO_COMM_BROKERUSER)
              SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT1_ENHANCEDUSER: $(SALEFORCE_UAT1_ENHANCEDUSER)
              SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_NO_COMM_BROKERUSER: $(SALEFORCE_UAT2_NO_COMM_BROKERUSER)
              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT2_ENHANCEDUSER: $(SALEFORCE_UAT2_ENHANCEDUSER)
              SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_CLAIMUSER: $(SALEFORCE_UAT2_CLAIMUSER)
              SALEFORCE_UAT2_CLAIMUSER_PASSWORD: $(SALEFORCE_UAT2_CLAIMUSER_PASSWORD)
              SALESFORCE_UAT2_JWT_CLIENT_ID: $(SALESFORCE_UAT2_JWT_CLIENT_ID)
              SALESFORCE_UAT2_JWT_USERNAME: $(SALESFORCE_UAT2_JWT_USERNAME)
              SALESFORCE_UAT2_JWT_LOGIN_URL: $(SALESFORCE_UAT2_JWT_LOGIN_URL)
              SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH: $(SALESFORCE_UAT2_JWT_PRIVATE_KEY_PATH)
              SIT1_MLIS_PORTAL_URL: $(SIT1_MLIS_PORTAL_URL)
              SIT1_SALESFORCE_LIGHTNING_URL: $(SIT1_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT1_NO_COMM_BROKERUSER: $(SALEFORCE_SIT1_NO_COMM_BROKERUSER)
              SALEFORCE_SIT1_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT1_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT1_CLAIMUSER: $(SALEFORCE_SIT1_CLAIMUSER)
              SALEFORCE_SIT1_CLAIMUSER_PASSWORD: $(SALEFORCE_SIT1_CLAIMUSER_PASSWORD)
              SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
              SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_SIT2_NO_COMM_BROKERUSER: $(SALEFORCE_SIT2_NO_COMM_BROKERUSER)
              SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_SIT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_SIT2_ENHANCEDUSER: $(SALEFORCE_SIT2_ENHANCEDUSER)
              SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_SIT2_ENHANCEDUSER_PASSWORD)
              DURQA_MLIS_PORTAL_URL: $(DURQA_MLIS_PORTAL_URL)
              DURQA_SALESFORCE_LIGHTNING_URL: $(DURQA_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_DURQA_NO_COMM_BROKERUSER: $(SALEFORCE_DURQA_NO_COMM_BROKERUSER)
              SALEFORCE_DURQA_NO_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_NO_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_INTER_COMM_BROKERUSER: $(SALEFORCE_DURQA_INTER_COMM_BROKERUSER)
              SALEFORCE_DURQA_INTER_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_INTER_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_BDE_COMM_BROKERUSER: $(SALEFORCE_DURQA_BDE_COMM_BROKERUSER)
              SALEFORCE_DURQA_BDE_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_BDE_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_INTRO_COMM_BROKERUSER: $(SALEFORCE_DURQA_INTRO_COMM_BROKERUSER)
              SALEFORCE_DURQA_INTRO_COMM_BROKERPASSWORD: $(SALEFORCE_DURQA_INTRO_COMM_BROKERPASSWORD)
              SALEFORCE_DURQA_ENHANCEDUSER: $(SALEFORCE_DURQA_ENHANCEDUSER)
              SALEFORCE_DURQA_ENHANCEDUSER_PASSWORD: $(SALEFORCE_DURQA_ENHANCEDUSER_PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'regression-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'regression-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 2b â€” CLAIMS TESTS
  # Triggered when tag == '@claims' or tag == 'all'
  # =========================================================================
  - stage: Claims_Tests
    displayName: 'Stage 2b â€” Claims Tests [@claims]'
    dependsOn: Regression_Tests
    condition: |
      and(
        or(
          eq('${{ parameters.tag }}', '@claims'),
          eq('${{ parameters.tag }}', 'all')
        ),
        in(dependencies.Regression_Tests.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped')
      )
    jobs:
      - job: RunClaims
        displayName: 'Claims [@claims] â€” $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 120
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps $(BROWSER)
            displayName: 'Install Playwright browser â€” $(BROWSER)'

          - script: >
              npx playwright test tests/claims/
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Claims tests (tests/claims/)'
            env:
              CI: $(CI)
              TEST_ENV: $(TEST_ENV)
              TEST_BROKER_PROFILE: $(TEST_BROKER_PROFILE)
              MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
              SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
              UAT1_MLIS_PORTAL_URL: $(UAT1_MLIS_PORTAL_URL)
              UAT1_SALESFORCE_LIGHTNING_URL: $(UAT1_SALESFORCE_LIGHTNING_URL)
              SALEFORCE_UAT1_NO_COMM_BROKERUSER: $(SALEFORCE_UAT1_NO_COMM_BROKERUSER)
              SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT1_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT1_ENHANCEDUSER: $(SALEFORCE_UAT1_ENHANCEDUSER)
              SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT1_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_NO_COMM_BROKERUSER: $(SALEFORCE_UAT2_NO_COMM_BROKERUSER)
              SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD: $(SALEFORCE_UAT2_NO_COMM_BROKERPASSWORD)
              SALEFORCE_UAT2_ENHANCEDUSER: $(SALEFORCE_UAT2_ENHANCEDUSER)
              SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD: $(SALEFORCE_UAT2_ENHANCEDUSER_PASSWORD)
              SALEFORCE_UAT2_CLAIMUSER: $(SALEFORCE_UAT2_CLAIMUSER)
              SALEFORCE_UAT2_CLAIMUSER_PASSWORD: $(SALEFORCE_UAT2_CLAIMUSER_PASSWORD)
              SALESFORCE_UAT2_JWT_CLIENT_ID: $(SALESFORCE_UAT2_JWT_CLIENT_ID)
              SALESFORCE_UAT2_JWT_USERNAME: $(SALESFORCE_UAT2_JWT_USERNAME)
              SALESFORCE_UAT2_JWT_LOGIN_URL: $(SALESFORCE_UAT2_JWT_LOGIN_URL)
